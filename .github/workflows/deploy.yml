name: Build & Deploy auf Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 QEMU für ARM64
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push (Multi-Arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PORT=8514
          tags: |
            ghcr.io/mark-baumann/ebay-scraping-agent:latest
            ghcr.io/mark-baumann/ebay-scraping-agent:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, pi, arm64]
    steps:
      - name: 🚀 Deploy auf Pi
        run: |
          docker pull ghcr.io/mark-baumann/ebay-scraping-agent:latest
          docker stop ebay-agent 2>/dev/null || true
          docker rm ebay-agent 2>/dev/null || true
          docker run -d --name ebay-agent --restart unless-stopped \
            -p 8514:8514 \
            ghcr.io/mark-baumann/ebay-scraping-agent:latest

      - name: 🩺 Health Check
        run: |
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8514/_stcore/health --max-time 3 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ebay-agent healthy auf Pi"
              exit 0
            fi
            echo "⏳ Versuch $i/10 — HTTP $STATUS"
            sleep 3
          done
          echo "❌ Health Check fehlgeschlagen"
          exit 1
