name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PORT=8514
          tags: |
            ghcr.io/mark-baumann/ebay-scraping-agent:latest
            ghcr.io/mark-baumann/ebay-scraping-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, markb]
    steps:
      - run: |
          cd /opt/data/stack
          docker compose pull ebay-agent
          docker compose up -d --no-deps ebay-agent
          docker image prune -f
      - run: |
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8514/_stcore/health --max-time 3 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ebay-agent healthy"
              exit 0
            fi
            echo "⏳ Versuch $i/10 — HTTP $STATUS"
            sleep 3
          done
          echo "❌ Health Check fehlgeschlagen"
          exit 1
